name: CI

on:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: tenant_guard_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/tenant_guard_test
      DIRECT_URL: postgresql://postgres:postgres@localhost:5432/tenant_guard_test
      TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/tenant_guard_test
      # Required by the auth rate limiter, which derives its key HMAC from this.
      # Without it every auth test throws. A fixed literal is correct here: CI
      # signs nothing that outlives the run, and a repository secret would make
      # forks fail for no security benefit.
      NEXTAUTH_SECRET: ci-only-not-a-real-secret
      NEXTAUTH_URL: http://localhost:3000
      NEXT_PUBLIC_APP_URL: http://localhost:3000
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: ".nvmrc"
          cache: "npm"
      - name: Install dependencies
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Prisma validate
        run: npx prisma validate
      - name: Run tests
        run: npm test
